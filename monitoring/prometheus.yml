global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'db-load-simulation'
    static_configs:
      - targets: [ 'db-load-simulation:8080' ]

  - job_name: 'metrics-exporter'
    static_configs:
      - targets: ['metrics-exporter:9187']

  - job_name: 'haproxy'
    static_configs:
      - targets: [ 'haproxy:8404' ]