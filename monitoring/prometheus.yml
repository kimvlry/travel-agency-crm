global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'db-load-simulation'
    static_configs:
      - targets: ['db-load-simulator:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['metrics-exporter:9187']
    scrape_interval: 10s