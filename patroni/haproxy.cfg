global
    maxconn 100
    log stdout local0

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s

listen postgres
    bind *:5432
    option httpchk GET /role
    http-check expect rstring "master"
    default-server inter 10s fall 5 rise 2 on-marked-down shutdown-sessions
    server node1 node1:5432 maxconn 100 check port 8008
    server node2 node2:5432 maxconn 100 check port 8008 backup

listen postgres_replica
    bind *:5433
    option httpchk GET /role
    http-check expect rstring "replica"
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server node1 node1:5432 maxconn 100 check port 8008
    server node2 node2:5432 maxconn 100 check port 8008

listen postgres_read
    bind *:5434
    option httpchk GET /role
    http-check expect rstring "master|replica"
    balance roundrobin
    default-server inter 3s fall 3 rise 2
    server node1 node1:5432 maxconn 100 check port 8008
    server node2 node2:5432 maxconn 100 check port 8008
