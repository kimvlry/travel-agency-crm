services:
  migration-test-postgres:
    image: postgres:15-alpine
    container_name: test-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - migration_test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  seqwall:
    build:
      context: .
    container_name: seqwall
    depends_on:
      migration-test-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@migration-test-postgres:5432/${POSTGRES_DB}?sslmode=disable
      DEPTH: ${DEPTH:-0}
    volumes:
      - ../:/workspace


volumes:
  migration_test_postgres_data:
