name: Test DB Migrations

on:
  push:
    branches: [ dev ]

jobs:
  test-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run migration tests with Seqwall
        run: |
          docker compose -f migrations/test/docker-compose.yaml up --build --abort-on-container-exit --exit-code-from seqwall

      - name: Cleanup
        if: always()
        run: |
          docker compose -f migrations/test/docker-compose.yaml down --volumes --remove-orphans
