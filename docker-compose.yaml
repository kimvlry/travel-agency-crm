services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd
    environment:
      ETCD_NAME: etcd-node
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd-node=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster
      ETCD_AUTO_COMPACTION_RETENTION: "1"
      ETCD_ENABLE_V2: "true"
    volumes:
      - etcd_data:/etcd-data
    command: etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgres-network
    restart: unless-stopped

  node1:
    build:
      context: ./patroni
      dockerfile: Dockerfile
    container_name: node1
    hostname: node1
    ports:
      - "5432:5432"
      - "8008:8008"
    environment:
      PATRONI_NAME: node1
      PATRONI_SCOPE: postgres-cluster
      PATRONI_ETCD3_HOSTS: "etcd:2379"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: node1:5432
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/pgdata
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PATRONI_RESTAPI_CONNECT_ADDRESS: node1:8008
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      PATRONI_LOG_LEVEL: INFO
      PATRONI_BOOTSTRAP_DCS_TTL: 30
      PATRONI_BOOTSTRAP_DCS_LOOP_WAIT: 10
      PATRONI_BOOTSTRAP_DCS_RETRY_TIMEOUT: 30
    volumes:
      - node1_data:/home/postgres/pgdata
    privileged: true
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8008/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - postgres-network
    restart: unless-stopped

  node2:
    build:
      context: ./patroni
      dockerfile: Dockerfile
    container_name: node2
    hostname: node2
    ports:
      - "5433:5432"
      - "8009:8008"
    environment:
      PATRONI_NAME: node2
      PATRONI_SCOPE: postgres-cluster
      PATRONI_ETCD3_HOSTS: "etcd:2379"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: node2:5432
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/pgdata
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PATRONI_RESTAPI_CONNECT_ADDRESS: node2:8008
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      PATRONI_LOG_LEVEL: INFO
      PATRONI_BOOTSTRAP_DCS_TTL: 30
      PATRONI_BOOTSTRAP_DCS_LOOP_WAIT: 10
      PATRONI_BOOTSTRAP_DCS_RETRY_TIMEOUT: 30
    volumes:
      - node2_data:/home/postgres/pgdata
    privileged: true
    depends_on:
      etcd:
        condition: service_healthy
      node1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8008/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - postgres-network
    restart: unless-stopped

  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy
    ports:
      - "15432:5432"   # Write port
      - "15433:5433"   # Read port
      - "8404:8404"    # Stats port
    volumes:
      - ./patroni/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
    networks:
      - postgres-network
    restart: unless-stopped
    command: haproxy -f /usr/local/etc/haproxy/haproxy.cfg -d
    healthcheck:
      test: ["CMD-SHELL", "pgrep haproxy || exit 1"]
      timeout: 5s
      retries: 3
      start_period: 30s

  cluster-ready:
    image: curlimages/curl:latest
    container_name: cluster-ready
    depends_on:
      haproxy:
        condition: service_healthy
    networks:
      - postgres-network
    command:
      - /bin/sh
      - -c
      - |
        echo 'Waiting for PostgreSQL cluster to be ready...'
        for i in {1..60}; do
          echo "Attempt $$i: Checking cluster status..."
        
          # Check if we can find a master node
          MASTER_FOUND=false
          for node in node1 node2; do
            echo "Checking $$node..."
            RESPONSE=$$(curl -s http://$$node:8008/master 2>/dev/null || echo "failed")
            if [ "$$?" -eq 0 ] && [ "$$RESPONSE" != "failed" ]; then
              echo "Master found on $$node"
              MASTER_FOUND=true
              break
            fi
          done
        
          if [ "$$MASTER_FOUND" = true ]; then
            echo "Cluster is ready!"
            exit 0
          fi
        
          echo "Cluster not ready yet, waiting 10 seconds..."
          sleep 10
        done
        
        echo "ERROR: Cluster failed to become ready within timeout"
        exit 1
    restart: "no"

  db-init:
    image: postgres:15-alpine
    container_name: db-init
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      cluster-ready:
        condition: service_completed_successfully
    networks:
      - postgres-network
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        echo 'Initializing database...'
        apk add --no-cache curl
        
        # Find the master node
        MASTER=""
        for node in node1 node2; do
          echo "Checking $$node for master role..."
          if curl -s http://$$node:8008/master >/dev/null 2>&1; then
            MASTER=$$node
            echo "Master found: $$MASTER"
            break
          fi
        done
        
        if [ -z "$$MASTER" ]; then
          echo "ERROR: Could not find master node"
          exit 1
        fi
        
        # Test connection to master
        echo "Testing connection to master..."
        psql -h $$MASTER -p 5432 -U postgres -c 'SELECT version();' || exit 1
        
        echo 'Database initialization complete'
    restart: "no"

  db-create:
    image: postgres:15-alpine
    container_name: db-create
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - postgres-network
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        echo 'Creating database...'
        apk add --no-cache curl
        
        # Find master node
        MASTER=""
        for node in node1 node2; do
          if curl -s http://$$node:8008/master >/dev/null 2>&1; then
            MASTER=$$node
            break
          fi
        done
        
        if [ -z "$$MASTER" ]; then
          echo "ERROR: Could not find master node"
          exit 1
        fi
        
        # Create database
        echo "Creating database on $$MASTER..."
        psql -h $$MASTER -p 5432 -U postgres -c "CREATE DATABASE ${POSTGRES_DB:-travel_agency_db};" || 
        echo 'Database might already exist'
        
        # Verify database creation
        psql -h $$MASTER -p 5432 -U postgres -c '\l' | grep '${POSTGRES_DB:-travel_agency_db}' && 
        echo 'Database created successfully!' || 
        echo 'Failed to create database'
    restart: "no"

  flyway:
    image: flyway/flyway:latest-alpine
    container_name: flyway_migrations
    depends_on:
      db-create:
        condition: service_completed_successfully
    environment:
      - MIGRATION_VERSION=${MIGRATION_VERSION:-latest}
      - POSTGRES_DB=${POSTGRES_DB:-travel_agency_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    entrypoint: ["/bin/bash"]
    command:
      - -c
      - |
        echo 'Starting Flyway migrations...'
        apk add --no-cache curl
        
        # Find master node directly
        MASTER=""
        for node in node1 node2; do
          echo "Checking $$node for master role..."
          if curl -s http://$$node:8008/master >/dev/null 2>&1; then
            MASTER=$$node
            echo "Master found: $$MASTER"
            break
          fi
        done
        
        if [ -z "$$MASTER" ]; then
          echo "ERROR: Could not find master node"
          exit 1
        fi
        
        # Use direct connection to master
        export FLYWAY_URL="jdbc:postgresql://$$MASTER:5432/$${POSTGRES_DB}"
        export FLYWAY_USER="$${POSTGRES_USER}"
        export FLYWAY_PASSWORD="$${POSTGRES_PASSWORD}"
        
        echo "Connecting to $$FLYWAY_URL"
        
        # Test connection
        echo 'Testing connection...'
        flyway -locations=filesystem:/flyway/sql info || exit 1
        
        echo 'Running migrations...'
        flyway -locations=filesystem:/flyway/sql migrate
        
        echo 'Migration completed, showing info...'
        flyway -locations=filesystem:/flyway/sql info
    volumes:
      - ./migrations/flyway/sql:/flyway/sql
    networks:
      - postgres-network
    restart: "no"

  seeding:
    container_name: seeder
    build:
      context: .
      dockerfile: seeding/Dockerfile
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      DB_HOST: haproxy
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MIGRATION_VERSION: ${MIGRATION_VERSION}
      SEED_COUNT: ${SEED_COUNT:-100}
      APP_ENV: ${APP_ENV}
      ANALYST_NAMES: ${ANALYST_NAMES}
    networks:
      - postgres-network

  db-load-simulation:
    container_name: db-load-simulator
    build:
      context: .
      dockerfile: db-load-simulation/Dockerfile
    depends_on:
      seeding:
        condition: service_completed_successfully
    environment:
      DB_HOST: haproxy
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ENV: ${APP_ENV}
    ports:
      - "8080:8080"
    networks:
      - postgres-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - postgres-network

  metrics-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: metrics-exporter
    environment:
      DATA_SOURCE_URI: "haproxy:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      - haproxy
      - flyway
    ports:
      - "9187:9187"
    networks:
      - postgres-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - postgres-network

  db-backup:
    container_name: db-backup
    build:
      context: .
      dockerfile: backup/Dockerfile
    environment:
      DB_HOST: haproxy
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT}
      BACKUP_INTERVAL_CRON: ${BACKUP_INTERVAL_CRON}
      BACKUP_SCRIPT_PATH: /app/backup.sh
    volumes:
      - ./backups:/backups
    depends_on:
      flyway:
        condition: service_completed_successfully
    networks:
      - postgres-network

volumes:
  grafana_data:
  node1_data:
  node2_data:
  prometheus_data:
  etcd_data:

networks:
  postgres-network: